<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Canonical — Repository graph</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/icons.js" defer></script>
    <script src="/g6.js" defer></script>
    <script src="/script.js" defer></script>
  </head>
  <body>
    <div
      id="canvas"
      class="canvas"
      aria-label="Expandable repository and dependency graph"
      aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown"
      title="Click directory titles to open them. Use the path above or Alt + Up to go to a parent. Drag empty space to pan."
      tabindex="0"
    ></div>
    <div id="measure" aria-hidden="true"></div>
    <nav id="directories" class="directory-navigation" aria-label="Directory navigation"></nav>
    <div class="graph-controls" role="toolbar" aria-label="Graph controls">
      <input id="search" type="search" placeholder="Search…" aria-label="Search graph" />
      <button id="refresh" class="quiet-button" title="Refresh graph" aria-label="Refresh graph">
        ↻
      </button>
      <button id="collapse" class="quiet-button" title="Collapse all" aria-label="Collapse all">
        ⊟
      </button>
      <button id="fit" class="quiet-button" title="Fit screen" aria-label="Fit screen">
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5M8 8h8v8H8Z" />
        </svg>
      </button>
      <label class="toggle" title="Semantic changes only"
        ><input id="changes" type="checkbox" /><span>Δ</span></label
      >
    </div>
    <nav id="cwd" class="current-directory" aria-label="Current directory" hidden></nav>
    <div id="message" role="status" hidden></div>
  </body>
</html>
