<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Canonical — Repository graph</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/script.js" defer></script>
  </head>
  <body>
    <div
      id="canvas"
      class="canvas"
      aria-label="Expandable repository and dependency graph"
      tabindex="0"
    ></div>
    <div class="graph-controls" role="toolbar" aria-label="Graph controls">
      <input id="search" type="search" placeholder="Search…" aria-label="Search graph" />
      <button id="refresh" class="quiet-button" title="Refresh graph" aria-label="Refresh graph">
        ↻
      </button>
      <button id="collapse" class="quiet-button" title="Collapse all" aria-label="Collapse all">
        ⊟
      </button>
      <button id="fit" class="quiet-button" title="Fit screen" aria-label="Fit screen">⛶</button>
      <label class="toggle" title="Semantic changes only"
        ><input id="changes" type="checkbox" /><span>Δ</span></label
      >
    </div>
    <div id="message" role="status" hidden></div>
  </body>
</html>
