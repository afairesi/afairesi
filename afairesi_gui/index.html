<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fdf6e3" />
    <meta
      name="description"
      content="Inspect your repositories, resource interfaces, and differences in one local workspace."
    />
    <title>afairesi — workspace</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23073642'/%3E%3Cpath d='M9 16h14' stroke='%23fdf6e3' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="toolbar" aria-label="Workspace controls">
      <button id="home" class="button brand" title="Home workspace">afairesi</button>
      <span id="current-directory" class="path" role="status" hidden></span>
      <input
        id="search"
        type="search"
        placeholder="Find a box…"
        aria-label="Find a box"
        aria-keyshortcuts="/"
        title="Find a box (/)"
      />
      <label class="diff-toggle" title="Show only interface differences">
        <input id="diff-only" type="checkbox" /> Diff
      </label>
      <button id="refresh" class="button" title="Refresh workspace">↻</button>
      <button id="fit" class="button">Fit</button>
      <button id="zoom-out" class="button" aria-label="Zoom out">−</button>
      <button id="zoom-in" class="button" aria-label="Zoom in">+</button>
    </header>
    <main
      id="viewport"
      aria-label="Repository dependency graph"
      title="Scroll to zoom · drag to pan"
      tabindex="0"
    >
      <div id="canvas">
        <svg id="edges" aria-label="Dependency relationships"></svg>
        <div id="boxes"></div>
      </div>
    </main>
    <span id="graph-status" class="sr-only" role="status">Reading home submodules…</span>
    <div id="repository-notice" class="notice" role="status" hidden></div>
    <div id="diff-status" class="diff-status" role="status" hidden></div>
  </body>
</html>
